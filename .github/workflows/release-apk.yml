name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # EXPO_TOKEN is stored as a secret of this environment.
    environment: Production
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Branch names may contain "/" (e.g. feat/x), so swap it for "-" in the file name.
      - name: Build APK
        id: apk
        run: |
          name="rong-${GITHUB_REF_NAME//\//-}.apk"
          eas build -p android --profile release --local --non-interactive \
            --output "$GITHUB_WORKSPACE/$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true

      # Manual runs (workflow_dispatch) only keep the APK as an artifact.
      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: rong-apk
          path: ${{ steps.apk.outputs.file }}

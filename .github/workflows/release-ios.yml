name: Build & Release iOS

# Build iOS bằng EAS ngay trên runner macOS (--local): repo public nên phút macOS miễn phí và không tốn
# lượt build iOS trên cloud EAS. Tách khỏi workflow APK để iOS lỗi không ảnh hưởng APK.
# Hướng dẫn thiết lập: docs/setup-ios-firebase.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Bản cho iOS Simulator (.app nén .tar.gz): không cần tài khoản Apple Developer, chỉ chạy trên Mac.
  simulator:
    runs-on: macos-latest
    timeout-minutes: 90
    # EXPO_TOKEN là secret của environment này.
    environment: Production
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Tên nhánh có thể chứa "/" (feat/x): đổi thành "-" cho tên file.
      - name: Build simulator app
        id: build
        run: |
          name="rong-${GITHUB_REF_NAME//\//-}-ios-simulator.tar.gz"
          eas build -p ios --profile ios-simulator --local --non-interactive \
            --output "$GITHUB_WORKSPACE/$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.build.outputs.file }}
        run: .github/scripts/upload-release-asset.sh "$GITHUB_REF_NAME" "$FILE"

      # Chạy tay (workflow_dispatch): chỉ giữ file làm artifact.
      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: rong-ios-simulator
          path: ${{ steps.build.outputs.file }}

  # Bản ad hoc (.ipa ký bằng tài khoản Apple Developer, chỉ cài được trên iPhone đã đăng ký UDID), rồi gửi
  # cho người thử qua Firebase App Distribution. Tắt cho tới khi đặt biến repo IOS_ADHOC_ENABLED=true
  # (biến cấp repo: biến của environment không đọc được ở `if` cấp job).
  adhoc:
    if: vars.IOS_ADHOC_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    environment: Production
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Profile "release" (distribution: internal) cho iOS là bản ad hoc. Chứng chỉ và profile lấy từ EAS
      # (thiết lập một lần bằng `eas credentials`, xem docs/setup-ios-firebase.md).
      - name: Build ad hoc .ipa
        id: build
        run: |
          name="rong-${GITHUB_REF_NAME//\//-}.ipa"
          eas build -p ios --profile release --local --non-interactive \
            --output "$GITHUB_WORKSPACE/$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.build.outputs.file }}
        run: .github/scripts/upload-release-asset.sh "$GITHUB_REF_NAME" "$FILE"

      - name: Distribute with Firebase App Distribution
        working-directory: .
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          FILE: ${{ steps.build.outputs.file }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_IOS_APP_ID" ]; then
            echo "::error::Thiếu secret FIREBASE_SERVICE_ACCOUNT hoặc biến FIREBASE_IOS_APP_ID (docs/setup-ios-firebase.md)."
            exit 1
          fi
          credentials="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          npx --yes firebase-tools@latest appdistribution:distribute "$FILE" \
            --app "$FIREBASE_IOS_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "Rong $GITHUB_REF_NAME ($(git rev-parse --short HEAD))"
          rm -f "$credentials"

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: rong-ios-adhoc
          path: ${{ steps.build.outputs.file }}

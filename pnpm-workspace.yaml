packages:
  - "apps/*"
  - "packages/*"

# pnpm chặn post-install script theo mặc định. Chỉ những package thực sự cần
# biên dịch native binary mới được bật ở đây.
allowBuilds:
  # Resolver viết bằng Rust, dùng bởi eslint-plugin-import-x trong eslint-config-next.
  unrs-resolver: true
  # sharp (toi uu anh cua Next) khong can build tu nguon tren dev machine.
  sharp: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
  - '@expo/ui@57.0.20'
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-router@57.0.23
